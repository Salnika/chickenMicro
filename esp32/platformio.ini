; ChickenMicro firmware — physical remote for Claude Desktop
;
; Targets
;   esp32dev                 reference board: ESP32-WROOM-32 DevKit V1
;   esp32dev_mock            same board, no panel attached (MockDisplay)
;   esp32-s3-devkitc-1       secondary: ESP32-S3 DevKitC-1 (different pinout)
;   esp32-c3-supermini       ESP32-C3 SuperMini, buttons on an MCP23008 expander
;   native                   host unit tests, no hardware
;
; Build          pio run -e esp32dev
; Flash          pio run -e esp32dev --target upload
; Serial log     pio device monitor
; Unit tests     pio test -e native

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[common]
build_flags =
	-Wall
	-Wextra
; src/tools/ holds standalone utilities with their own setup()/loop(); the
; application builds must leave them out or the link sees two entry points.
build_src_filter_app =
	+<*>
	-<tools/>
lib_deps_display =
	zinggjm/GxEPD2@^1.6.0
	adafruit/Adafruit GFX Library@^1.11.9
lib_deps_json =
	bblanchon/ArduinoJson@^7.0.4
; The WS2812B under each keycap. Driven through the RMT peripheral.
lib_deps_lights =
	adafruit/Adafruit NeoPixel@^1.12.3
; The setup screen's "join this Wi-Fi" QR code: Project Nayuki's qrcodegen, C.
lib_deps_qr =
	liux-pro/qrcode generator@^1.7.2

; ---------------------------------------------------------------------------
; Reference target: ESP32-WROOM-32 DevKit V1
; Pinout: docs/wiring.md / include/Config.h
; ---------------------------------------------------------------------------
[env:esp32dev]
; Pinned. Unpinned, CI resolves a newer core than any developer has cached and
; the same source produces a different binary — the C3 went from 69% of its
; partition to 100.4% and stopped linking, on a commit that changed no code.
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
; The default table leaves 1.25 MB for the app, which this firmware no longer
; fits with WiFi, WebServer, GxEPD2 and the QR generator in it. huge_app drops
; the second OTA slot — unused here, nothing does OTA — for a 3 MB app. NVS
; stays at 0x9000/0x5000 in both tables, so stored OTP accounts survive the
; change.
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
	${common.build_flags}
build_src_filter = ${common.build_src_filter_app}
lib_deps =
	${common.lib_deps_display}
	${common.lib_deps_json}
	${common.lib_deps_lights}
	${common.lib_deps_qr}

; ---------------------------------------------------------------------------
; Same board with no display wired up. Renders into RAM and reports what it
; drew as protocol `log` frames, so controls and protocol can be developed and
; flashed before the panel arrives.
; ---------------------------------------------------------------------------
[env:esp32dev_mock]
extends = env:esp32dev
build_src_filter = ${common.build_src_filter_app}
build_flags =
	${common.build_flags}
	-DEINK_MODEL=EINK_MODEL_MOCK
; Uncomment for a coarse ASCII rendering of every frame in the log:
;	-DCM_MOCK_DISPLAY_ASCII
lib_deps =
	${common.lib_deps_display}
	${common.lib_deps_json}
	${common.lib_deps_lights}
	${common.lib_deps_qr}

; ---------------------------------------------------------------------------
; Secondary target: ESP32-S3 DevKitC-1.
; This repo's display bring-up ran on an S3, so the board is kept buildable.
; Its pinout differs — see the CM_BOARD_ESP32S3 block in include/Config.h.
; ---------------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_src_filter = ${common.build_src_filter_app}
build_flags =
	${common.build_flags}
	-DCM_BOARD_ESP32S3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	${common.lib_deps_display}
	${common.lib_deps_json}
	${common.lib_deps_lights}
	${common.lib_deps_qr}

; ---------------------------------------------------------------------------
; ESP32-C3 SuperMini, the smallest build.
;
; Thirteen usable GPIO is not enough for a panel, a joystick and five buttons
; each on its own pin, so the buttons move onto an MCP23008 I2C I/O expander —
; see the CM_INPUTS_ON_MCP23008 block in include/Config.h, and the wiring in
; docs/wiring-esp32c3-supermini.md.
;
; No UART bridge on this board: Serial is the C3's native USB, which macOS shows
; as /dev/cu.usbmodem*. The daemon already looks there.
;
; esp32-c3-devkitm-1 is the closest stock definition. DIO flash mode because it
; works with every flash chip these clones ship with, where QIO does not.
; ---------------------------------------------------------------------------
[env:esp32-c3-supermini]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_src_filter = ${common.build_src_filter_app}
build_flags =
	${common.build_flags}
	-DCM_BOARD_ESP32C3_SUPERMINI
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	${common.lib_deps_display}
	${common.lib_deps_json}
	${common.lib_deps_lights}
	${common.lib_deps_qr}

; ---------------------------------------------------------------------------
; One-shot panel cleaner, NOT the firmware.
;
; The application runs the panel in monochrome, and the mono waveform cannot
; move red pigment — so red left over from a tri-colour session stays on the
; glass forever. This env flashes a standalone program that loads the
; tri-colour waveform once and cycles black / red / white to wipe it (~45 s).
;
;   pio run -e esp32dev_clear_panel --target upload
;   pio device monitor
;   pio run -e esp32dev --target upload          # back to the firmware
;
; On an ESP32-S3, add -DCM_BOARD_ESP32S3 to build_flags below. The firmware's
; own menu (hold the joystick -> Clean the screen) runs the same cycle on any
; board, the C3 SuperMini included, without reflashing.
; ---------------------------------------------------------------------------
[env:esp32dev_clear_panel]
extends = env:esp32dev
build_src_filter =
	-<*>
	+<tools/ClearPanel.cpp>
build_flags =
	${common.build_flags}
	-DEINK_MODEL=EINK_MODEL_GDEY0213Z98_TRI

; ---------------------------------------------------------------------------
; Host unit tests. Covers the parts with no hardware in them: the NDJSON line
; reader, protocol validation, request-id rules, action encoding, the joystick
; dead zone / dominant axis / repeat logic, and the button rules — debounce,
; click versus hold, and the MCP23008 decoding that must never invent a press.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
; `pio test` does not link src/ unless asked; build_src_filter then narrows it
; to the files that carry no Arduino dependency.
test_build_src = yes
build_flags =
	${common.build_flags}
	-std=gnu++17
	-DCM_NATIVE_TEST
	-I include
build_src_filter =
	+<Protocol.cpp>
	+<LineReader.cpp>
	+<JoystickLogic.cpp>
	+<TextLayout.cpp>
	+<State.cpp>
	+<ButtonState.cpp>
	+<KeyLegend.cpp>
	+<Totp.cpp>
	+<WifiQr.cpp>
lib_deps =
	${common.lib_deps_json}
	${common.lib_deps_qr}
