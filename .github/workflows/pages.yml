name: Pages

# The site and the firmware are built by two independent jobs that run at the
# same time and never wait on each other. The firmware takes minutes and needs
# a whole embedded toolchain; the page takes seconds. Chaining them meant a
# toolchain problem took the site down with it, which is backwards — the page
# is useful on its own, and it already says so when an image is missing.
#
# So: the site deploys whatever happens to the firmware. A failed firmware job
# is reported, and the flasher shows "no image published for this build yet"
# until it is fixed.

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'esp32/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run is always newer than the one in flight, but never cancel a
# deployment half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    name: Build the page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, not 20: Vite 8 wants ^20.19 || >=22.12. This builds the site only,
      # so it does not constrain what the daemon supports.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      - run: npm run build
        working-directory: site

      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: site/dist
          retention-days: 1

  firmware:
    name: Build the firmware images
    runs-on: ubuntu-latest
    # Never fails the run: the page ships without images rather than not at all.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('esp32/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - run: pip install --upgrade platformio esptool

      - run: site/scripts/build-firmware.sh

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: site/public/firmware
          retention-days: 1

  deploy:
    name: Deploy
    needs: [site, firmware]
    # `always()` so a failed firmware job cannot hold the page back; the page
    # itself still has to have built.
    if: always() && needs.site.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: page
          path: dist

      # Missing when the firmware job failed, which is allowed to happen.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: firmware
          path: dist/firmware

      - name: Say what is being published
        run: |
          if [ -f dist/firmware/manifest.json ]; then
            echo "Firmware images:"
            cat dist/firmware/manifest.json
          else
            echo "::warning::No firmware images — the flasher will report none published."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
