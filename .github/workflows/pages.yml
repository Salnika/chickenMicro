name: Pages

# The site ships the firmware it flashes, so this builds esp32/ first and only
# then the Vite app. Nothing binary is committed: the images are produced here
# and exist only inside the artifact that gets deployed.

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'esp32/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run is always newer than the one in flight, but never cancel a
# deployment half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('esp32/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - run: pip install --upgrade platformio esptool

      - name: Build and merge the firmware images
        run: site/scripts/build-firmware.sh

      # 22, not 20: Vite 8 wants ^20.19 || >=22.12, and this only builds the
      # site. The daemon's own job stays on 20, which is what its engines
      # field claims to support.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      - run: npm run build
        working-directory: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
